<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Générateur de citations</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>✨ Citation du moment</h1>
    <blockquote id="citation">Clique sur le bouton pour découvrir une citation…</blockquote>
    <p id="auteur" class="auteur"></p>
    <div class="boutons">
      <button id="btn-nouvelle">Nouvelle citation</button>
      <button id="btn-copier" class="secondaire">Copier</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
